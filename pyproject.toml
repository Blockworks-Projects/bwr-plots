[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bwr-plots"
version = "0.2.0"
description = "Reusable Blockworks plotting helpers"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.3",
  "plotly>=5.18.0",
  "pydantic>=2.11.7",
  "termcolor>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bwr_plots"]
