[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bwr-plots"
version = "0.2.4"
description = "Reusable Blockworks plotting helpers"
requires-python = ">=3.11"
dependencies = [
  "great-tables>=0.15.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.5,<4.0.0",
  "pandas>=2.1.3",
  "plotly>=5.18.0",
  "pydantic>=2.11.7",
  "termcolor>=2.5.0",
]

[project.scripts]
bwr-plots = "bwr_plots.cli:main"

[dependency-groups]
test = [
  "pytest>=8.3.2",
]
lint = [
  "ruff>=0.6.9",
]
dev = [
  "build>=1.2.2",
  { include-group = "test" },
  { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/bwr_plots"]
